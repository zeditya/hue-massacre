; Godot 4 Web export preset for Hue Massacre.
;
; This file is plain INI. Godot reads it when you open Project > Export and
; finds a preset called "Web" already set up, so you do not have to configure
; anything by hand.
;
; Two deliberate choices, both explained in HOW_TO_RUN.md:
;
;   variant/thread_support=false
;       Single-threaded build. A threaded web build needs the host server to
;       send the COOP/COEP security headers, which GitHub Pages and a plain
;       `python -m http.server` will NOT do. Single-threaded trades a little
;       speed for a build that runs anywhere, including itch.io and Pages.
;
;   variant/extensions_support=false
;       We use no GDExtension or native libraries, so this stays off.
;
; export_path points at build/web/index.html, which is already in .gitignore
; because it is generated output, not source.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
